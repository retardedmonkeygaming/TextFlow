<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>TextFlow</title>
        <link rel="stylesheet" href="styles.css">
    
    </head>
    <body>
        <h1>TextFlow</h1>

        <textarea id="input" placeholder="Paste nessy text here..."></textarea>

        <div class="buttons">
            <button id="cleanBtn">Clean Text</button>
            <button id="listBtn">Make Markdown List</button>
            <button id="truncateBtn">Truncate</button>
        </div>

        <textarea id="output" placeholder="Cleaned text will appear here..." readonly></textarea>

        <button id="copyBtn">Copy to Clipboard</button>

        <script src="popup.js"></script>
    </body>
</html>
